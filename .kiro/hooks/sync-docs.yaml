name: Sync Melanin Technologies Documentation
description: >
  Automatically updates architecture docs, ai-sre runbooks, K8s manifests docs,
  and MelaninDocs whenever infrastructure, agent configuration, or workflow files change.

trigger:
  fileChanged:
    patterns:
      - "Kiro/Projects/kiro-agents/docker/docker-compose.yml"
      - "Kiro/Projects/kiro-agents/docker/Dockerfile*"
      - "Kiro/Projects/kiro-agents/k8s/**/*.yaml"
      - "Kiro/Projects/kiro-agents/orchestrator/**/*.py"
      - "Kiro/Projects/kiro-agents/agents/**/*.py"
      - "Kiro/Projects/kiro-agents/AI/darius/**/*.py"
      - "Kiro/Projects/kiro-agents/config/settings.py"
      - "Kiro/Projects/kiro-agents/.env"
      - "MelaninDocs/**/*.md"

prompt: |
  The following files were changed: {{changedFiles}}

  You have access to update documentation across the entire Melanin Technologies org.
  Base path: /Users/pktech_dev/Documents/MelaninTechnologies/

  Determine which documents need updating based on what changed, then make only the sections that are now inaccurate:

  ## If infrastructure/agent files changed (docker-compose, Dockerfiles, k8s, .py, settings, .env):

  1. **A.I./ai-sre/docs/architecture.md**
     - Update component/agent list, infra section, SLOs if relevant values changed
     - Stack is always: Anthropic Claude, local Docker, Kubernetes, local storage (no Azure, no AWS)

  2. **A.I./ai-sre/infra/kubernetes/agent_deployment.yaml**
     - Keep in sync with Kiro/Projects/kiro-agents/k8s/kiro-agents/ manifests

  3. **A.I./ai-sre/automation/scripts/health_check.py**
     - Update service list if agents or MCP sidecars were added/removed

  4. **A.I./ai-sre/observability/runbooks/incident_response.md**
     - Update agent names and ports if services changed

  5. **Kiro/Projects/kiro-agents/k8s/README.md**
     - Update port map and image list if services changed

  6. **MelaninDocs/Onboarding/MelaninTechnologiesInternalOnboarding.md**
     - Update the AI/agent tooling section if the agent stack changed
     - Update the development workflow section if orchestrator or routing changed
     - Do NOT touch finance, legal, or HR sections

  ## If a MelaninDocs file changed:

  Update only the specific document that changed and any directly related docs in the same subfolder.
  Match the existing tone, format, and structure of the document.
  Do not rewrite sections that are still accurate.

  ## Rules (always):
  - Never reference Azure, AWS, or any cloud provider
  - Only edit sections that are factually wrong after the change
  - Do not add aspirational content — only document what actually exists
  - Finance/ folder is read-only — never modify files there
