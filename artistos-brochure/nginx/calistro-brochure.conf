# Calistro Creative Brochure — brochure.calistrocreative.com
# Hardened for public-facing deployment
# Security: CSP, X-Frame-Options DENY, no embedding, rate limiting

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name brochure.calistrocreative.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend + API proxy — unified under one domain
server {
    listen 443 ssl;
    http2 on;
    server_name brochure.calistrocreative.com;

    ssl_certificate     /etc/letsencrypt/live/calistrocreative.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calistrocreative.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:;" always;

    server_tokens off;

    # ── API routes → brochure backend ─────────────────────────────────────────
    location /api/ {
        limit_req zone=general burst=5 nodelay;

        proxy_pass http://artistos-brochure-api:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;

        client_max_body_size 10k;
    }

    # Health check
    location = /health {
        proxy_pass http://artistos-brochure-api:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Static frontend ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://artistos-brochure-frontend:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
    }
    location ~ ~$ {
        deny all;
    }
}
