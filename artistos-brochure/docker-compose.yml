services:
  artistos-brochure-frontend:
    build: ./frontend
    container_name: artistos-brochure-frontend
    ports:
      - "3030:3030"
    depends_on:
      - artistos-brochure-api
    restart: unless-stopped

  artistos-brochure-api:
    build: ./backend
    container_name: artistos-brochure-api
    ports:
      - "8030:8030"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

networks:
  default:
    external: true
    name: docker_agent-net
