# Golden Test Cases — Lines of Business
# Validates Darius understands each LOB's context and can respond appropriately.

cases:
  - id: lob_orthoflow_purpose
    category: lob_context
    query: "What is OrthoFlow and what problem does it solve?"
    project: orthoflow
    expected_behavior: "Explains OrthoFlow as orthodontic/dental AI platform"
    expected_keywords:
      - orthodontic
      - dental
      - patient
      - AI

  - id: lob_parcelpro_purpose
    category: lob_context
    query: "Explain the ParcelPro platform and its target market"
    project: parcelpro
    expected_behavior: "Describes logistics/delivery platform"
    expected_keywords:
      - parcel
      - delivery
      - logistics

  - id: lob_artistos_purpose
    category: lob_context
    query: "What is ArtistOS and who is it built for?"
    project: artistos
    expected_behavior: "Describes creative platform for artists/musicians"
    expected_keywords:
      - artist
      - creative
      - platform

  - id: lob_htc_purpose
    category: lob_context
    query: "What is Held Together Caregiving?"
    project: htc
    expected_behavior: "Describes caregiving coordination platform"
    expected_keywords:
      - caregiver
      - caregiving
      - care

  - id: lob_onboarding_process
    category: lob_context
    query: "How do we onboard a new client at Melanin Technologies?"
    project: default
    expected_behavior: "References SOP, proposal, contract, environment setup"
    expected_keywords:
      - onboard
      - client
      - contract

  - id: lob_melanin_mission
    category: lob_context
    query: "What is the mission and purpose of Melanin Technologies?"
    project: default
    expected_behavior: "References company manifesto, technology services, enterprise AI"
    expected_keywords:
      - technology
      - Melanin
