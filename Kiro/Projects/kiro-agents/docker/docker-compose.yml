    restart: unless-stopped

  deploy-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    env_file: ../.env
    environment:
      - PROJECTS_BASE=/app/Projects
      - COMPOSE_FILE=/app/docker/docker-compose.yml
      - COMPOSE_ENV=/app/.env
      - STEERING_DIR=/app/.kiro/steering
      - PROFILES_DIR=/app/.kiro/agents/profiles
    networks:
      - agent-net
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/docker:/app/docker:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/.env:/app/.env:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website:/app/melanin-tech-website:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    restart: unless-stopped

  support-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.support_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  # --- MCP Sidecars ---
  mcp-github:
    image: ghcr.io/github/github-mcp-server:latest
    command: ["http", "--port", "9010", "--toolsets", "default,git,gists,notifications"]
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
    networks:
      - agent-net
    restart: unless-stopped

  mcp-postgres:
    image: node:22-slim
    env_file: ../.env
    command: >
      sh -c "npx -y supergateway --port 9011 --stdio 'npx -y @modelcontextprotocol/server-postgres $$POSTGRES_DSN'"
    networks:
      - agent-net
    restart: unless-stopped

  mcp-figma:
    image: node:22-slim
    env_file: ../.env
    command: >
      sh -c "npx -y figma-developer-mcp --figma-api-key=$$FIGMA_ACCESS_TOKEN --port=9012"
    environment:
      - MCP_TRANSPORT=sse
      - PORT=9012
    networks:
      - agent-net
    restart: unless-stopped

  mcp-fetch:
    image: node:22-slim
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq python3 python3-pip > /dev/null 2>&1 &&
             pip install --break-system-packages -q mcp-server-fetch &&
             npx -y supergateway --port 9013 --stdio 'python3 -m mcp_server_fetch'"
    networks:
      - agent-net
    restart: unless-stopped

  # MCP Gateway — custom tools: Slack, Google, Cloudflare, Docker
  mcp-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "orchestrator.mcp_gateway:app", "--host", "0.0.0.0", "--port", "9014"]
    env_file: ../.env
    environment:
      - POSTGRES_DSN=postgresql://kiro:${POSTGRES_PASSWORD}@pgbouncer:5432/kiro
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/integrations:/app/integrations:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/docker:/app/docker:ro
    networks:
      - agent-net
    depends_on:
      - postgres
    restart: unless-stopped

  darius-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.darius
    env_file: ../.env
    environment:
      - PROJECTS_BASE=/app/Projects
      - MCP_URL=http://mcp-server:9000
      - MCP_GATEWAY_URL=http://mcp-gateway:9014
      - DARIUS_MODEL=anthropic/claude-sonnet-4-6
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - DARIUS_AUTONOMOUS=true
      - STEERING_DIR=/app/.kiro/steering
      - PROFILES_DIR=/app/.kiro/agents/profiles
      - MODELS_CONFIG=/app/_models.json
    ports:
      - "8100:8000"
    networks:
      - agent-net
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/_registry.json:/app/_registry.json:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/_models.json:/app/_models.json:ro
    restart: unless-stopped

  # --- Utility Agents ---
  code-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.code_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/CodeAgent:/app/Projects/CodeAgent:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  file-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.file_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/FileAgent:/app/Projects/FileAgent:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/FileAgent/output:/app/Projects/FileAgent/output:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  # ── Held Together Caregiver (HTC) ──────────────────────────────────────────────

  htc-frontend:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Held_Together_Caregiving/htc-app/frontend
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "5174:5174"
    restart: unless-stopped

  htc-backend:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Held_Together_Caregiving/htc-app/backend
      dockerfile: Dockerfile
    networks:
      - agent-net
    restart: unless-stopped

  # ── Odysseus AI Workspace ─────────────────────────────────────────────────────

  searxng:
    image: searxng/searxng:2026.5.31-7159b8aed
    networks:
      - agent-net
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    networks:
      - agent-net
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    networks:
      - agent-net
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

  odysseus:
    image: ghcr.io/pewdiepie-archdaemon/odysseus:latest
    ports:
      - "127.0.0.1:7000:7000"
    networks:
      - agent-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AUTH_ENABLED=true
      - ODYSSEUS_ADMIN_USER=admin
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - OPENAI_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=https://workspace.melanin-tech.com,http://localhost:7000
      - SECURE_COOKIES=true
      - PUID=1000
      - PGID=1000
    volumes:
      - odysseus-data:/app/data
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  # ── Vaultwarden (Bitwarden Self-Hosted) — Secret Manager ────────────────────

  vaultwarden:
    image: vaultwarden/server:latest
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - agent-net
    environment:
      - DOMAIN=https://emerald.melanin-tech.com
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_VERIFY=false
      - REQUIRE_DEVICE_EMAIL=false      - SMTP_FROM_NAME=Melanin Tech Vault
    volumes:
      - vaultwarden-data:/data
    restart: unless-stopped

