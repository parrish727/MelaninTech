networks:
  agent-net:
    driver: bridge

x-agent: &agent-base
  build:
    context: ..
    dockerfile: docker/Dockerfile.agent
  env_file: ../.env
  environment:
    - PROJECTS_BASE=/app/Projects
    - STEERING_DIR=/app/.kiro/steering
    - PROFILES_DIR=/app/.kiro/agents/profiles
  networks:
    - agent-net
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped
  volumes:
    - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
    - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kiro
      POSTGRES_USER: kiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - agent-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiro"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-net
    ports:
      - "6433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - agent-net
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.0
    networks:
      - agent-net
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    networks:
      - agent-net
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && ollama pull mistral-small:24b && ollama pull qwen3:14b && wait"]

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      - HOST_COMPOSE_FILE=/Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/docker/docker-compose.yml
      - HOST_ENV_FILE=/Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/.env
      - HOST_WEBSITE_PATH=/Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website
      - STEERING_DIR=/app/.kiro/steering
      - PROFILES_DIR=/app/.kiro/agents/profiles
      - PYTHONUNBUFFERED=1
    ports:
      - "9090:9090"
    networks:
      - agent-net
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/config:/app/config
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/docker:/app/docker:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/.env:/app/.env:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website:/app/melanin-tech-website
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website/public/previews:/app/previews
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness:/app/LinesOfBusiness
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-ai/OrthoFlow/frontend:/app/orthoflow-frontend
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-ai/OrthoFlow/backend:/app/orthoflow-backend
      - /Users/pktech_dev/Documents/MelaninTechnologies/MelaninDocs:/app/MelaninDocs
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "orchestrator.mcp_server:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file: ../.env
    environment:
      - PROJECTS_BASE=/app/Projects
    networks:
      - agent-net
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website:/app/melanin-tech-website:ro
    depends_on:
      - postgres
    restart: unless-stopped

  preview-server:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    labels:
      - "managed-by=kiro-deploy-agent"

  testing-server:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    restart: unless-stopped
    labels:
      - "managed-by=kiro-deploy-agent"
      - "env=testing"

  staging-server:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    restart: unless-stopped
    labels:
      - "managed-by=kiro-deploy-agent"
      - "env=staging"

  production-server:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
    restart: unless-stopped
    labels:
      - "managed-by=kiro-deploy-agent"
      - "env=production"

  # OrthoFlow marketing website — orthoflowsolutions.com
  orthoflow-marketing:
    build:
      context: /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-marketing
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "3010:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SLACK_DEMO_WEBHOOK_URL=${SLACK_DEMO_WEBHOOK_URL}
    restart: unless-stopped
    labels:
      - "managed-by=kiro-deploy-agent"
      - "env=production"

  # --- Public-facing infrastructure ---

  # Melanin Tech HUD — internal monitoring dashboard
  hud:
    build:
      context: ../hud/backend
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      - POSTGRES_DSN=postgresql://kiro:${POSTGRES_PASSWORD}@pgbouncer:5432/kiro
      - OLLAMA_URL=http://ollama:11434
    networks:
      - agent-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/governance:/app/governance:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/integrations:/app/integrations:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/MelaninDocs:/app/melanin-docs:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/graphify-out:/app/graphify-out:ro
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped

  hud-frontend:
    build:
      context: ../hud/frontend
      dockerfile: Dockerfile
    networks:
      - agent-net
    ports:
      - "4000:4000"
    depends_on:
      - hud
    restart: unless-stopped

  # Cloudflare DDNS — keeps melanintech.com A record pointed at current home IP
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.15.0
    network_mode: host
    env_file: ../.env
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_API_TOKEN}
      DOMAINS: melanin-tech.com,www.melanin-tech.com,hud.melanin-tech.com,orthoflowsolutions.com,www.orthoflowsolutions.com,app.orthoflowsolutions.com,api.orthoflowsolutions.com,brochure.orthoflowsolutions.com
      PROXIED: "false"
      UPDATE_CRON: "@every 5m"

  # nginx reverse proxy — TLS termination + security hardening
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/melanintech.conf:/etc/nginx/conf.d/melanintech.conf:ro
      - ./nginx/orthoflow.conf:/etc/nginx/conf.d/orthoflow.conf:ro
      - ./nginx/brochure.conf:/etc/nginx/conf.d/brochure.conf:ro
      - ./nginx/calistro-brochure.conf:/etc/nginx/conf.d/calistro-brochure.conf:ro
      - ./nginx/ppbrochure.conf:/etc/nginx/conf.d/ppbrochure.conf:ro
      - ./nginx/parcelpro.conf:/etc/nginx/conf.d/parcelpro.conf:ro
      - ./nginx/hud.conf:/etc/nginx/conf.d/hud.conf:ro
      - ./nginx/secrets.conf:/etc/nginx/conf.d/secrets.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/parcelpro-brochure:/var/www/parcelpro-brochure:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    networks:
      - agent-net
    depends_on:
      - production-server
    restart: unless-stopped

  # nginx-reload — watches container restarts and auto-reloads nginx
  nginx-reload:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "while true; do
        docker events --filter 'event=start' --filter 'type=container' --format '{{.Actor.Attributes.name}}' |
        while read name; do
          case \"$$name\" in
            docker-hud-*|docker-production-*|docker-staging-*|docker-testing-*|docker-preview-*|docker-htc-*|orthoflow-*|docker-vaultwarden-*)
              sleep 3;
              docker exec docker-nginx-1 nginx -s reload 2>/dev/null && echo \"[nginx-reload] reloaded for $$name\";
              ;;
          esac;
        done;
      done"
    networks:
      - agent-net
    restart: unless-stopped

  # certbot — obtains and renews Let's Encrypt TLS cert
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    restart: unless-stopped

  # seo-pipeline — weekly SEO analysis, keyword tracking, and auto-ticket generation
  # Runs every Sunday at 11pm ET. Sleeps the rest of the time.
  seo-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      sh -c "while true; do
        CURRENT_DAY=$$(date +%u);
        CURRENT_HOUR=$$(date +%H);
        if [ \"$$CURRENT_DAY\" = \"7\" ] && [ \"$$CURRENT_HOUR\" = \"23\" ]; then
          python3 scripts/seo_cron.py;
          sleep 3600;
        fi;
        sleep 1800;
      done"
    env_file: ../.env
    environment:
      - POSTGRES_DSN=postgresql://kiro:${POSTGRES_PASSWORD}@pgbouncer:5432/kiro
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/integrations:/app/integrations:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/scripts:/app/scripts:ro
    networks:
      - agent-net
    depends_on:
      - postgres
      - searxng
    restart: unless-stopped

  # fail2ban — bans IPs with repeated bad requests
  fail2ban:
    image: crazymax/fail2ban:1.1.0
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban:/data
      - /var/log:/var/log:ro
    environment:
      - TZ=America/New_York
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=1d
    restart: unless-stopped


  # cert expiry monitor — checks daily, Slack alert 30 days before expiry
  cert-monitor:
    image: alpine/openssl:latest
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - ./scripts/check-cert-expiry.sh:/check.sh:ro
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
    entrypoint: >
      sh -c "apk add --no-cache curl > /dev/null 2>&1;
             while true; do sh /check.sh; sleep 86400; done"
    restart: unless-stopped

  security-watchdog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python3", "scripts/security_watchdog.py", "--daemon"]
    env_file: ../.env
    networks:
      - agent-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/scripts:/app/scripts:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/logs:/app/logs
    group_add:
      - "0"
    restart: unless-stopped

  scaffold-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.scaffold_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  qa-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.qa_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website:/app/melanin-tech-website:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-ai/OrthoFlow/frontend:/app/orthoflow-frontend:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-ai/OrthoFlow/backend:/app/orthoflow-backend:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  sre-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.sre_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    read_only: false
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/docker:/app/docker:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects/kiro-agents/governance:/app/governance:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro
    group_add:
      - "0"

  dba-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.dba_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    read_only: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  backend-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.backend_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-ai/OrthoFlow/backend:/app/orthoflow-backend:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  frontend-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.frontend_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - PROJECTS_BASE=/app/Projects
      - MELANIN_WEBSITE_PATH=/app/melanin-tech-website
      - STEERING_DIR=/app/.kiro/steering
      - PROFILES_DIR=/app/.kiro/agents/profiles
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website:/app/melanin-tech-website:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/LinesOfBusiness/Orthodontic_Dental/orthoflow-ai/OrthoFlow/frontend:/app/orthoflow-frontend:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  uxui-agent:
    <<: *agent-base
    command: ["python", "-m", "uvicorn", "agents.uxui_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - PROJECTS_BASE=/app/Projects
      - MELANIN_WEBSITE_PATH=/app/melanin-tech-website
      - PLAYWRIGHT_MCP_URL=http://playwright-mcp:9001
      - STEERING_DIR=/app/.kiro/steering
      - PROFILES_DIR=/app/.kiro/agents/profiles
    volumes:
      - /Users/pktech_dev/Documents/MelaninTechnologies/Kiro/Projects:/app/Projects:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/melanin-tech-website:/app/melanin-tech-website:rw
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/steering:/app/.kiro/steering:ro
      - /Users/pktech_dev/Documents/MelaninTechnologies/.kiro/agents/profiles:/app/.kiro/agents/profiles:ro

  playwright-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright
    networks:
      - agent-net
    ports:
      - "9001:9001"
    volumes:
