# fail2ban filter: nginx-botsearch (custom)
# Matches automated secret/config/admin probing seen against melanin-tech.com
# and all LOBs. Parses the nginx access log where $remote_addr is the real
# client IP (via CF-Connecting-IP real_ip mapping).
#
# Matches requests for:
#   - secret files: *.yml/.yaml/.json/.env/.pem/.key/.txt credential paths
#   - config paths: /config/*, /private/*, /server/*, mailer/mailgun/stripe/sendgrid/ses
#   - CMS probes: /wp-json/*, /wp-admin, /wp-login, index.php variants
#   - admin/keys: /admin/*, /keys/*, /.git, /.aws, id_ecdsa/id_rsa
#   - elasticsearch/db probes: /_cat/*, *.mysql, *.sql

[Definition]

failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*(mailgun|sendgrid|smtp_credentials|mailer|stripe|ses\.json|credentials\.json|\.env|id_ecdsa|id_rsa|\.git/|\.aws|/wp-(json|admin|login|content)|/_cat/|\.mysql|/config/|/private/|/keys/|debug\.log|dump\.log|cert\.pem)[^"]*" (4\d\d|3\d\d)

ignoreregex =

datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
