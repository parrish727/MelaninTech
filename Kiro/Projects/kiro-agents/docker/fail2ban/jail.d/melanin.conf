[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 10
banaction = iptables-multiport
# fail2ban runs on network_mode: host, so iptables bans apply at the origin.
# NOTE: with Cloudflare proxying (orange-cloud), origin sees Cloudflare IPs at the
# TCP layer; the real client IP comes from CF-Connecting-IP in the nginx access log,
# which these filters parse. Origin iptables is defense-in-depth for any traffic that
# reaches the origin directly (CF bypass). Edge blocking is handled by Cloudflare WAF.

# Bans IPs probing for secrets / config / admin paths (the current attack pattern).
# Reads the ACCESS log where $remote_addr = real CF-Connecting-IP.
[nginx-botsearch]
enabled  = true
port     = http,https
filter   = nginx-botsearch
logpath  = /var/log/nginx/access_f2b.log
maxretry = 3
findtime = 5m
bantime  = 24h

# Bans IPs that trip nginx rate limiting repeatedly.
[nginx-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/error_f2b.log
maxretry = 10
findtime = 10m
bantime  = 6h

# Standard nginx auth failures.
[nginx-http-auth]
enabled  = true
port     = http,https
filter   = nginx-http-auth
logpath  = /var/log/nginx/error_f2b.log
