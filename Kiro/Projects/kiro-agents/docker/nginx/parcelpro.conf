# ParcelPro Application — parcelpro.melanin-tech.com
# Frontend app + API backend + tile server
# Uses melanin-tech.com wildcard cert (Cloudflare proxy enabled)

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name parcelpro.melanin-tech.com api.parcelpro.melanin-tech.com tiles.parcelpro.melanin-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend App — parcelpro.melanin-tech.com ─────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name parcelpro.melanin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/melanin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melanin-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        proxy_pass http://host.docker.internal:5176;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API Backend — api.parcelpro.melanin-tech.com ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.parcelpro.melanin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/melanin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melanin-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;
    client_max_body_size 50m;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    location / {
        proxy_pass http://host.docker.internal:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Tile Server — tiles.parcelpro.melanin-tech.com ────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name tiles.parcelpro.melanin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/melanin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melanin-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "https://parcelpro.melanin-tech.com" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    server_tokens off;

    # Tile caching (vector tiles are static per z/x/y)
    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache tiles for 1 hour
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }
}
