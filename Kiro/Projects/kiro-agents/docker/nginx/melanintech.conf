# nginx reverse proxy — melanin-tech.com (Cloudflare proxy compatible)

# ── Trust Cloudflare IPs for real client IP ───────────────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ── Rate limiting (uses real client IP, not Cloudflare IP) ────────────────────
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=contact:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name melanin-tech.com www.melanin-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.melanin-tech.com$request_uri;
    }
}

# ── HTTPS — www canonical ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.melanin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/melanin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melanin-tech.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/melanin-tech.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    server_tokens off;

    limit_conn addr 20;
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Block common attack patterns
    location ~* \.(php|asp|aspx|jsp|cgi|sh|py|pl|env|git|htaccess|htpasswd|sql|bak|swp)$ {
        return 404;
    }
    location ~ /\. { return 404; }

    location /api/contact {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://production-server:3000;
        include /etc/nginx/proxy_params;
    }

    location /_next/static/ {
        proxy_pass http://production-server:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/proxy_params;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://production-server:3000;
        include /etc/nginx/proxy_params;
    }
}

# ── Redirect bare domain → www ────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name melanin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/melanin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melanin-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.melanin-tech.com$request_uri;
}
