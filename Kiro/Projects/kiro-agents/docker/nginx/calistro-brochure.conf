# Calistro Creative Brochure — brochure.calistrocreative.com
# SEALED MODE (2026-09-24): marketing page stays live, but attack surface locked down.
# Not under active development — probe patterns and scanner UAs are hard-dropped (444).

# ── Blocked scanner User-Agents (AI/secret-scanning bots seen probing) ──────────
# Returns 444 (close connection, no response) so scanners get zero signal.
map $http_user_agent $calistro_bad_ua {
    default                 0;
    "~*DeepSeekBot"         1;
    "~*PanguBot"            1;
    "~*Bytespider"          1;
    "~*GPTBot"              1;
    "~*ClaudeBot"           1;
    "~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|wpscan)"  1;
    "~*(python-requests|Go-http-client|libwww-perl|curl/)"  1;
    ""                      1;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name brochure.calistrocreative.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend + API proxy
server {
    listen 443 ssl;
    http2 on;
    server_name brochure.calistrocreative.com;

    ssl_certificate     /etc/letsencrypt/live/brochure.calistrocreative.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brochure.calistrocreative.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:;" always;

    server_tokens off;

    # ── SEAL: drop scanner UAs immediately ──────────────────────────────────────
    if ($calistro_bad_ua) {
        return 444;
    }

    # ── SEAL: only allow GET/HEAD (dormant site — no other methods needed) ──────
    if ($request_method !~ ^(GET|HEAD)$) {
        return 444;
    }

    # ── SEAL: hard-drop secret/config/CMS probe patterns (444 = no signal) ──────
    location ~* (\.env|\.git|\.aws|\.ssh|\.sql|\.mysql|\.bak|\.swp|\.log|\.yml|\.yaml|\.pem|\.key|/config/|/private/|/keys/|/mailer/|mailgun|sendgrid|smtp|stripe|credentials|/wp-|/_cat/|/vendor/|/\.well-known/(?!acme-challenge)) {
        return 444;
    }
    location ~ /\. {
        return 444;
    }
    location ~ ~$ {
        return 444;
    }

    # API routes → Calistro brochure backend (tightened — site is dormant)
    location /api/ {
        limit_req zone=general burst=3 nodelay;

        proxy_pass http://artistos-brochure-api:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;

        client_max_body_size 10k;
    }

    # Health check
    location = /health {
        proxy_pass http://artistos-brochure-api:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static frontend (marketing page — stays live)
    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://artistos-brochure-frontend:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
