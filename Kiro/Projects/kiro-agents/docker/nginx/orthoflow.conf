# OrthoFlow Solutions — nginx reverse proxy
# Cloudflare real_ip is set in melanintech.conf (shared)
#
# Upstream wiring: backend + frontend are on docker_agent-net so nginx reaches
# them via container DNS — no host.docker.internal, no IPv4/IPv6 ambiguity,
# no host port exposure. Data layer (postgres, redis, minio) stays on the
# isolated orthoflow_orthoflow network.

# ── Rate limiting ─────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=of_api:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=of_app:10m    rate=60r/m;
limit_req_zone $binary_remote_addr zone=of_auth:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=of_addr:10m;

# ── Upstream pools with keepalive ─────────────────────────────────────────────
# Keepalive reuses connections to the backend rather than opening a new TCP
# handshake per request — critical for the FastAPI API and Uvicorn under load.
upstream orthoflow_api {
    server orthoflow-backend-1:8000;
    keepalive 32;
}

upstream orthoflow_app {
    server orthoflow-frontend-1:3000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name orthoflowsolutions.com www.orthoflowsolutions.com app.orthoflowsolutions.com api.orthoflowsolutions.com brochure.orthoflowsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── App frontend — app.orthoflowsolutions.com ─────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.orthoflowsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/orthoflowsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthoflowsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OF_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    server_tokens off;

    limit_conn of_addr 30;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Block common attack patterns
    location ~* \.(php|asp|aspx|jsp|cgi|sh|py|pl|env|git|htaccess|htpasswd|sql|bak|swp)$ {
        return 404;
    }
    location ~ /\. { return 404; }

    # Static asset cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://orthoflow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=of_app burst=40 nodelay;
        proxy_pass http://orthoflow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API backend — api.orthoflowsolutions.com ─────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.orthoflowsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/orthoflowsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthoflowsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OF_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    limit_conn of_addr 30;
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Block common attack patterns
    location ~* \.(php|asp|aspx|jsp|cgi|sh|pl|env|git|htaccess|htpasswd|bak|swp)$ {
        return 404;
    }
    location ~ /\. { return 404; }

    # Auth endpoints — tight rate limit
    location ~ ^/api/v1/(auth|login|register|token) {
        limit_req zone=of_auth burst=5 nodelay;
        proxy_pass http://orthoflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=of_api burst=60 nodelay;
        proxy_pass http://orthoflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Bare domain + www → marketing site ───────────────────────────────────────
server {
