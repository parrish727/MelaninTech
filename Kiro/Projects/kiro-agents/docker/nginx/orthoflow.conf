# OrthoFlow Solutions — nginx reverse proxy
# Cloudflare real_ip is set in melanintech.conf (shared)

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name orthoflowsolutions.com www.orthoflowsolutions.com app.orthoflowsolutions.com api.orthoflowsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# App frontend — app.orthoflowsolutions.com
server {
    listen 443 ssl;
    http2 on;
    server_name app.orthoflowsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/orthoflowsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthoflowsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API backend — api.orthoflowsolutions.com
server {
    listen 443 ssl;
    http2 on;
    server_name api.orthoflowsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/orthoflowsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthoflowsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect bare domain and www → app
server {
    listen 443 ssl;
    http2 on;
    server_name orthoflowsolutions.com www.orthoflowsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/orthoflowsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthoflowsolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://app.orthoflowsolutions.com$request_uri;
}
