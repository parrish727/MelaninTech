
user  nginx;
worker_processes  auto;

# Dual error logging: real file (for fail2ban) + stderr (for docker logs).
# NOTE: the base image symlinks /var/log/nginx/{access,error}.log -> /dev/std{out,err},
# so we write the fail2ban-readable copy to *_f2b.log real files in the nginx-logs
# volume, and keep stdout/stderr for `docker logs`.
error_log  /var/log/nginx/error_f2b.log notice;
error_log  /dev/stderr notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $remote_addr resolves to the real client IP because real_ip_header
    # CF-Connecting-IP is set globally (see melanintech.conf). This is what
    # fail2ban reads to ban the true attacker, not the Cloudflare edge IP.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Dual access logging: real file (for fail2ban to tail) + stdout (docker logs).
    access_log  /var/log/nginx/access_f2b.log  main;
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
