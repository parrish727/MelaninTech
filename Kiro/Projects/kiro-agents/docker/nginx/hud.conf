# Melanin Tech HUD — internal monitoring (hud.melanin-tech.com)

server {
    listen 80;
    server_name hud.melanin-tech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hud.melanin-tech.com;

    ssl_certificate     /etc/letsencrypt/live/melanin-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melanin-tech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    # Frontend (dev mode for now)
    location / {
        proxy_pass http://host.docker.internal:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # API
    location /api/ {
        proxy_pass http://hud:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
