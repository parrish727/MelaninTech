# OrthoFlow Brochure — brochure.orthoflowsolutions.com
# Hardened for public-facing deployment
# Security: CSP, X-Frame-Options DENY, no embedding, rate limiting

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name brochure.orthoflowsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend + API proxy — unified under one domain
server {
    listen 443 ssl;
    http2 on;
    server_name brochure.orthoflowsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/orthoflowsolutions.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthoflowsolutions.com-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ──────────────────────────────────────────────────────
    # HSTS — force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent clickjacking — no one should embed the brochure in an iframe
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # XSS protection (legacy but doesn't hurt)
    add_header X-XSS-Protection "1; mode=block" always;
    # Permissions policy — disable unneeded APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    # Content Security Policy — tight lockdown
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:;" always;

    # Hide server version
    server_tokens off;

    # ── API routes → brochure backend ─────────────────────────────────────────
    location /api/ {
        # Rate limit at nginx level (additional layer on top of app-level)
        limit_req zone=general burst=5 nodelay;

        proxy_pass http://orthoflow-brochure-api:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;

        # Limit request body size (no one needs to send >10KB in a chat)
        client_max_body_size 10k;
    }

    # Health check (no rate limit, no auth)
    location = /health {
        proxy_pass http://orthoflow-brochure-api:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Static frontend ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://orthoflow-brochure-frontend:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
    }
    location ~ ~$ {
        deny all;
    }
}
