apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: melanin-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: docker-mcp-server:latest
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "orchestrator.mcp_server:app", "--host", "0.0.0.0", "--port", "9000"]
          envFrom:
            - secretRef:
                name: agent-secrets
          env:
            - name: PROJECTS_BASE
              value: /app/Projects
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: projects
              mountPath: /app/Projects
              readOnly: true
            - name: website
              mountPath: /app/melanin-tech-website
              readOnly: true
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: projects-data
        - name: website
          persistentVolumeClaim:
            claimName: website-data
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: melanin-tech
spec:
  selector:
    app: mcp-server
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-github
  namespace: melanin-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-github
  template:
    metadata:
      labels:
        app: mcp-github
    spec:
      containers:
        - name: mcp-github
          image: ghcr.io/github/github-mcp-server:latest
          args: ["http", "--port", "9010", "--toolsets", "default,git,gists,notifications"]
          env:
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: GITHUB_TOKEN
          ports:
            - containerPort: 9010
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-github
  namespace: melanin-tech
spec:
  selector:
    app: mcp-github
  ports:
    - port: 9010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-mcp
  namespace: melanin-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-mcp
  template:
    metadata:
      labels:
        app: playwright-mcp
    spec:
      containers:
        - name: playwright-mcp
          image: docker-playwright-mcp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9001
          volumeMounts:
            - name: screenshots
              mountPath: /screenshots
      volumes:
        - name: screenshots
          persistentVolumeClaim:
            claimName: playwright-screenshots
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-mcp
  namespace: melanin-tech
spec:
  selector:
    app: playwright-mcp
  ports:
    - port: 9001
