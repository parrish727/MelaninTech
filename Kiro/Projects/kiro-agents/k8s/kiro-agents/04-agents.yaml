# ── Darius Agent ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darius-agent
  namespace: melanin-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: darius-agent
  template:
    metadata:
      labels:
        app: darius-agent
    spec:
      containers:
        - name: darius-agent
          image: docker-darius-agent:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: agent-secrets
          env:
            - name: PROJECTS_BASE
              value: /app/Projects
            - name: MCP_URL
              value: http://mcp-server:9000
            - name: DARIUS_MODEL
              value: anthropic/claude-sonnet-4-6
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: projects
              mountPath: /app/Projects
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: projects-data
---
apiVersion: v1
kind: Service
metadata:
  name: darius-agent
  namespace: melanin-tech
spec:
  selector:
    app: darius-agent
  ports:
    - port: 8000
