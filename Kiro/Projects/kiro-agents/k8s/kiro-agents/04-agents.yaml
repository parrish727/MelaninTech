# Shared env template for all agents
# Each agent gets envFrom: agent-secrets + its own env overrides

# ── Orchestrator ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: melanin-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: docker-orchestrator:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: agent-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: projects
              mountPath: /app/Projects
            - name: website
              mountPath: /app/melanin-tech-website
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: projects-data
        - name: website
          persistentVolumeClaim:
            claimName: website-data
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
# ── Delivery Agents ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaffold-agent
  namespace: melanin-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaffold-agent
  template:
    metadata:
      labels:
        app: scaffold-agent
    spec:
      containers:
        - name: scaffold-agent
          image: docker-scaffold-agent:latest
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "agents.scaffold_agent:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - secretRef:
                name: agent-secrets
          env:
            - name: PROJECTS_BASE
              value: /app/Projects
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: projects
              mountPath: /app/Projects
      volumes:
        - name: projects
          persistentVolumeClaim:
            claimName: projects-data
---
apiVersion: v1
kind: Service
metadata:
  name: scaffold-agent
  namespace: melanin-tech
spec:
  selector:
    app: scaffold-agent
  ports:
    - port: 8000
---
