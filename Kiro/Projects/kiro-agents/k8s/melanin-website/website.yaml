---
# ── Production ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-server
  namespace: melanin-website
  labels:
    env: production
    managed-by: kiro-deploy-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-server
  template:
    metadata:
      labels:
        app: production-server
    spec:
      containers:
        - name: production-server
          image: melanin-tech-website:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: website-src
              mountPath: /app
              readOnly: true
      volumes:
        - name: website-src
          persistentVolumeClaim:
            claimName: website-src
