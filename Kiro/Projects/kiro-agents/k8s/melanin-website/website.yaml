# Melanin Technologies Website — Kubernetes Manifests
# Environments: preview (3001), testing (3002), staging (3003), production (3000)

apiVersion: v1
kind: Namespace
metadata:
  name: melanin-website
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: website-src
  namespace: melanin-website
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 5Gi
---
# ── Preview ───────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-server
  namespace: melanin-website
  labels:
    env: preview
    managed-by: kiro-deploy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-server
  template:
    metadata:
      labels:
        app: preview-server
    spec:
      containers:
        - name: preview-server
          image: melanin-tech-website:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3001"
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: website-src
              mountPath: /app
              readOnly: true
      volumes:
        - name: website-src
          persistentVolumeClaim:
            claimName: website-src
---
apiVersion: v1
kind: Service
metadata:
  name: preview-server
  namespace: melanin-website
spec:
  selector:
    app: preview-server
  type: NodePort
  ports:
    - port: 3001
      nodePort: 30001
---
# ── Testing ───────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-server
  namespace: melanin-website
  labels:
    env: testing
    managed-by: kiro-deploy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testing-server
  template:
    metadata:
      labels:
        app: testing-server
    spec:
      containers:
        - name: testing-server
          image: melanin-tech-website:latest
          imagePullPolicy: Never
          env:
            - name: PORT
