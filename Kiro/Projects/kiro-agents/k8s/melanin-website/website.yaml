          ports:
            - containerPort: 3002
          volumeMounts:
            - name: website-src
              mountPath: /app
              readOnly: true
      volumes:
        - name: website-src
          persistentVolumeClaim:
            claimName: website-src
---
apiVersion: v1
kind: Service
metadata:
  name: testing-server
  namespace: melanin-website
spec:
  selector:
    app: testing-server
  type: NodePort
  ports:
    - port: 3002
      nodePort: 30002
---
# ── Staging ───────────────────────────────────────────────────────────────────
apiVersion: apps/v1
