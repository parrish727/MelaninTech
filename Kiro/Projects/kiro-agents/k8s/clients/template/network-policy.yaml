# Client Namespace Network Policy — deny-all default + allow ingress only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: client-{{SLUG}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
# Allow only ingress-nginx to reach the website pod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: client-{{SLUG}}
spec:
  podSelector:
    matchLabels:
      app: website
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
