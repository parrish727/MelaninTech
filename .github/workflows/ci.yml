name: MelaninTech Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Validate nginx configs ───────────────────────────────────────────────
  nginx-validate:
    name: Validate nginx configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test nginx configuration syntax
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Kiro/Projects/kiro-agents/docker/nginx:/etc/nginx/conf.d:ro" \
            nginx:alpine \
            nginx -t 2>&1 || true
          # Run with a minimal nginx.conf that just includes our conf.d files
          docker run --rm \
            -v "${{ github.workspace }}/Kiro/Projects/kiro-agents/docker/nginx:/etc/nginx/conf.d:ro" \
            nginx:alpine \
            sh -c "nginx -t && echo 'nginx config OK'"

  # ── 2. Validate docker-compose files ────────────────────────────────────────
  compose-validate:
    name: Validate docker-compose syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate main infra compose
        run: |
          docker compose \
            -f Kiro/Projects/kiro-agents/docker/docker-compose.yml \
            config --quiet && echo "main compose OK"

  # ── 3. Validate YAML files (governance, config, workflows) ──────────────────
  yaml-validate:
    name: Validate YAML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            Kiro/Projects/kiro-agents/config/ \
            Kiro/Projects/kiro-agents/docker/otel/ \
            Kiro/Projects/kiro-agents/docker/tempo/ \
            Kiro/Projects/kiro-agents/docker/pgbouncer/pgbouncer.ini || true
          # Lint workflow templates
          find Kiro/Projects/kiro-agents/workflows -name "*.yaml" -exec \
            yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" {} \;

  # ── 4. Python lint + type check ─────────────────────────────────────────────
  python-lint:
    name: Python lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Kiro/Projects/kiro-agents/requirements.txt
          pip install ruff mypy types-redis

      - name: Ruff lint
        run: |
          ruff check Kiro/Projects/kiro-agents/agents/ \
                     Kiro/Projects/kiro-agents/orchestrator/ \
                     Kiro/Projects/kiro-agents/integrations/ \
                     Kiro/Projects/kiro-agents/scripts/ \
                     Kiro/Projects/kiro-agents/AI/ \
                     --ignore E501,F401 \
                     --output-format github

      - name: Mypy type check (non-blocking)
        run: |
          mypy Kiro/Projects/kiro-agents/agents/ \
               Kiro/Projects/kiro-agents/orchestrator/ \
               --ignore-missing-imports \
               --no-error-summary || true

  # ── 5. Run existing tests ────────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Kiro/Projects/kiro-agents/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest Kiro/Projects/kiro-agents/AI/darius/tests/ \
            -v --tb=short \
            --ignore=Kiro/Projects/kiro-agents/AI/darius/tests/__pycache__ \
            2>&1 || true

  # ── 6. Notify on failure ─────────────────────────────────────────────────────
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [nginx-validate, compose-validate, yaml-validate, python-lint, test]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":x: *MelaninTech CI failed* on `main`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
